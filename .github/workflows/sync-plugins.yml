name: Sync plugin catalogue

# src/data/plugins.ts mirrors nox-hq/registry by hand, and by 2026-09 it had
# drifted on 18 of 21 plugins -- stale versions everywhere, and four archived
# plugins presented as current. This runs scripts/sync-plugins.mjs daily: it
# rewrites versions from the registry and opens a PR, like the changelog sync,
# so a human still sees public copy before it ships. Drift that needs words --
# a plugin missing from the page, one the registry dropped, or a deprecated
# plugin still shown as current -- fails the job with a warning naming it.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch: {} # nox:ignore IAC-308,IAC-155 -- syncing on demand is the point; its only output is a PR, which is where review happens

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request collides with the AUTHORIZATION extraheader
          # actions/checkout persists, producing `Duplicate header` / HTTP 400.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Update versions from the registry
        id: sync
        run: node scripts/sync-plugins.mjs || echo "drift=true" >> "$GITHUB_OUTPUT"

      - name: Open a PR when versions changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/sync-plugins
          title: 'chore: sync plugin versions from the registry'
          commit-message: 'chore: sync plugin versions from the registry'
          body: |
            Generated by `scripts/sync-plugins.mjs` from nox-hq/registry's
            `index.json`. Only versions change here; summaries stay
            hand-written.
          delete-branch: true

      # After the PR, so version updates are never held back by it.
      - name: Fail on drift that needs a human
        if: steps.sync.outputs.drift == 'true'
        run: |
          echo "::error title=Plugin catalogue drift::the page and the registry disagree on something only a human can fix; see the warnings above"
          exit 1
