name: Sync changelog

# The site is a separate repository from the scanner, so release notes are
# copied rather than imported. `scripts/sync-changelog.mjs` does that
# mechanically — but running it was left to whoever remembered, and by
# 2026-07-26 the site was four releases behind (1.18.0 published while 1.22.0
# had shipped). A copy step that depends on memory is a copy step that stops.
#
# This runs the same script in `remote` mode and opens a PR when the output
# differs. It does NOT commit to main directly: the generated notes are public
# marketing copy, and a human should see them before they are published.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch: {} # nox:ignore IAC-308 -- syncing release notes on demand is the point

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request collides with the AUTHORIZATION extraheader
          # actions/checkout persists, producing `Duplicate header` / HTTP 400.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Sync release notes from nox's CHANGELOG
        env:
          NOX_CHANGELOG: remote
        run: node scripts/sync-changelog.mjs

      # A release with no CHANGELOG section produces no page, silently. That
      # already happened once: v1.17.1 shipped on 2026-07-25 with no section,
      # so it has no release notes anywhere. Report it rather than let the
      # gap close over.
      - name: Report releases with no notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for tag in $(gh release list --repo nox-hq/nox --limit 20 --json tagName --jq '.[].tagName'); do
            v="${tag#v}"
            case "$v" in 0.*) continue ;; esac
            [ -f "src/content/changelog/${v}.md" ] || missing="${missing} ${tag}"
          done
          if [ -n "${missing}" ]; then
            echo "::warning title=Releases with no changelog section::${missing# } — these ship with no release notes on the site because nox's CHANGELOG.md has no section for them."
          fi

      - name: Open a PR when the notes changed
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: chore/sync-changelog
          title: 'chore: sync release notes from nox'
          commit-message: 'chore: sync release notes from nox'
          body: |
            Generated by `scripts/sync-changelog.mjs` from nox's `CHANGELOG.md`.

            These files are generated — do not hand-edit them; the next sync
            overwrites them. Fix wording in nox's `CHANGELOG.md` instead.
          delete-branch: true
